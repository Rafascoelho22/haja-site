name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # O index.html é escrito sem <!doctype>/<html> para também servir de Artifact no Claude.
      # Aqui ele ganha o cabeçalho de documento completo antes de ir para o ar.
      - name: Montar a página
        run: |
          mkdir -p _site
          cp -r site/. _site/
          { echo '<!doctype html>'; echo '<html lang="pt-BR">'; cat site/index.html; echo '</html>'; } > _site/index.html

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
